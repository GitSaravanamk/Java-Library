
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LIBRARY }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LIBRARY }}

      # Step 4: Build and upload Docker image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            DOCKER-USERNAME-LIBRARY/java-library-management-system:latest
            DOCKER-USERNAME-LIBRARY/java-library-management-system:${{ github.sha }}
